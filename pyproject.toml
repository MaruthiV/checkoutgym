[project]
name = "checkoutgym"
version = "0.1.0"
description = "harness that scores llm shopping agents as agentic commerce protocol clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
agents = ["anthropic>=0.40", "openai>=1.50"]
serve = ["uvicorn>=0.30"]

[project.scripts]
checkoutgym = "checkoutgym.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "uvicorn>=0.30", "anthropic>=0.40", "openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checkoutgym"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# runner must catch everything to record errored trials; sim115 is style noise for tiny scripts
ignore = ["BLE001", "SIM115", "PLW1510"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
